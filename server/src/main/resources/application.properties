spring.application.name=fitfuel

server.port=8080

# MYSQL CONFIG
spring.datasource.url=jdbc:mysql://localhost:3306/fitfuel
spring.datasource.username=root
spring.datasource.password=SERVEROFSUBASIS

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# MONGODB CONFIG
spring.data.mongodb.uri=mongodb://localhost:27017/fitfuel_catalog
spring.data.mongodb.database=fitfuel_catalog
spring.data.mongodb.auto-index-creation=true

